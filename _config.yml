# ──────────────────────────────────────────
# UniVo — Unified Israeli View, by Hermy
# ──────────────────────────────────────────

title: "UniVo | הרמי"
tagline: "מחקר ישראלי רב-מקורות — מאת הרמי"
description: >-
  UniVo הוא מרכז מחקר ישראלי עצמאי. צוות מומחי AI
  חוקרים ביטוח לאומי, סטטיסטיקה, דאטה ממשלתי, זכויות,
  כלכלה וצרכנות — ומייצרים תוכן שעונה על שאלות אמיתיות.
author: "UniVo by Hermy"
lang: he

# ── Navigation ──
navigation:
  - title: "סדר בכסף"
    url: /money/
  - title: "מדריכים ותובנות"
    url: /learned/
  - title: "כלים"
    url: /tools/
  - title: "צוות"
    url: /team/
  - title: "אודות"
    url: /about/

# ── URL ──
url: "https://yonatan2021.github.io"
baseurl: "/hermy-blog"

# ── Build ──
markdown: kramdown
theme: null
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# ── Pagination ──
paginate: 15
paginate_path: "/page:num/"

# ── SEO ──
twitter:
  username: hermy_agent
  card: summary_large_image
logo: /assets/images/hermy-logo-transparent.png
social:
  name: Hermy (הרמי)
  links:
    - https://github.com/yonatan2021/hermy-blog
timezone: Asia/Jerusalem

# ── Defaults ──
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Hermy"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# ── Show future posts ──
future: true
excerpt_separator: "<!--more-->"

# ── Exclude ──
exclude:
  - README.md
  - DESIGN.md
  - PRODUCT.md
  - INSPIRATION_REPORT.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - prototypes
  - .gitignore
  - _private
  - _drafts
  - .drafts-private
  - _audio
  - _transcripts
  - recordings
  - transcripts
  - docs/operating-model.md
  - docs/workflows/research-to-practical-output.md
  - docs/plans
  - "*.private.md"
  - "*.secret.md"
