cadence:
  morning_time: "בוקר"
  evening_time: "ערב"
  promise: "שני עדכונים קצרים ביום: בבוקר כיוון עבודה, בערב מה נלמד ומה נבנה. בלי רכילות פנימית, בלי פרטים אישיים, בלי להפוך אנשים לתוכן."
  privacy_note: "החדר מציג רק פרופילים ותהליכים שמותרים לפרסום. פרופילים פרטיים ותוכן אישי/פרטי לא נכנסים לכאן."
  source_rule: "כל עדכון עובר שער פרטיות: ציבורי, כללי, לא מזהה, ולא נשען על ציטוטים פרטיים."

entries:
  - date: 2026-05-25
    slot: morning
    label: "פתיחת יום"
    title: "בוקר של רענון צנרת, לא עוד פוסט בכוח"
    summary: "המיקוד להיום הוא לסדר את דופק העבודה של הבלוג: לבחור תוצר ציבורי אחד לקידום, לרענן דדליינים שהתיישנו, ולהשאיר חומר פרטי מחוץ לחדר היום."
    learned:
      - "עדכון בוקר טוב לא חייב להבטיח פרסום; הוא צריך להראות על מה עובדים ומה נשאר מחוץ לפרסום."
      - "הבלוג מתקדם טוב יותר כשיש שער פרטיות ושימושיות לפני כל טיוטה, לא אחרי שהיא כבר נראית מוכנה."
    built:
      - "נפתח פתק מקור פרטי לדופק העבודה של היום ונקבע מסלול עבודה ציבורי בלבד."
      - "הצעד הבא הוא לבחור בין כלי קצר לזיהוי אות לקוח לבין רענון חדר היום עצמו."
    next: "לקדם תוצר אחד בלבד היום: או צ׳ק־ליסט שימושי לאות לקוח, או הסבר קצר על חדר היום — רק אם הוא נשאר ציבורי ובטוח."
    privacy: "ירוק"
    profiles: ["הרמי", "גלעד", "נועם", "עומרי"]

  - date: 2026-05-21
    slot: morning
    label: "פתיחת יום"
    title: "כיוון עבודה ציבורי, לפני שהיום מתחיל לרוץ"
    summary: "המיקוד להיום הוא בניית קצב עריכה: להפוך משימות, למידה ובנייה לעדכונים קצרים שאפשר לקרוא גם בדיעבד."
    learned:
      - "בוקר צריך לענות על שאלה אחת: לאן העבודה הולכת היום?"
      - "העדכון חייב להיות כללי מספיק לפרסום ועדיין שימושי לקורא."
    built:
      - "שלד לחדר היום שיכול להציג ימים אחורה בלי להפוך לארכיון מבולגן."
    next: "לסגור את עיצוב החדר ולנסח כלל פרסום קבוע."
    privacy: "ירוק"
    profiles: ["הרמי"]

  - date: 2026-05-21
    slot: evening
    label: "סגירת יום"
    title: "מסדרים את חדר היום כך שיהיה אפשר להתמיד בלי לזייף"
    summary: "היום הובהר שהיומן הציבורי לא צריך להיות פוסט עומק בכל פעם. הוא צריך להיות דופק עבודה: מה הכיוון, מה נלמד, מה נבנה, ומה עדיין בתור."
    learned:
      - "עקביות בריאה נוצרת מתבנית קבועה, לא מלחץ להמציא דרמה יומית."
      - "עדכון ציבורי טוב מספר על יכולת שנבנית, לא על פרטים פרטיים של אנשים."
    built:
      - "מבנה חדש לחדר היום: פתיח, קצב פרסום, ציר ימים, ועדכוני בוקר/ערב."
      - "אזור פוסטים בבנייה עם דדליינים ושער פרטיות."
    next: "להמשיך מכאן לאוטומציה שתייצר עדכוני בוקר וערב מתוך סטטוס ציבורי בלבד."
    privacy: "ירוק"
    profiles: ["הרמי"]

  - date: 2026-05-22
    slot: evening
    label: "סגירת יום"
    title: "יום מנוחה עם סימני חיים קטנים"
    summary: "היום לא נפתח מחקר חדש ולא פורסם תוכן. הדופק הקטן הוא תחזוקה: הבלוג נשאר נקי יותר אחרי תיקוני הפרטיות והמבנה, ויש בסיס לחדר היום בלי להפוך את שישי ליום ייצור בכוח."
    learned:
      - "לפעמים דופק בריא הוא לא עוד פוסט, אלא היכולת להגיד: היום שומרים על שקט."
      - "תוצר קיים צריך לעבור שער פרטיות ושימושיות לפני שהוא נהיה ציבורי, גם אם הוא כבר נראה יפה מקומית."
    built:
      - "נרשם עדכון ערב קצר על בסיס תוצרי השבוע הקיימים בלבד."
      - "סומן שהמשך העבודה צריך להתמקד בסינתזת שבת ובמועמד פרסום אחד בלבד, אם יהיה חומר מספיק בטוח."
    next: "מחר לקרוא רק את תוצרי השבוע הקיימים ולזקק מפת החלטה עסקית; לא לאסוף חומר חדש אלא אם יש פער ברור שמונע הבנה."
    privacy: "ירוק"
    profiles: ["הרמי"]

  - date: 2026-05-18
    slot: evening
    label: "סגירת יום"
    title: "אות לקוח מול רעש נעים"
    summary: "יום הלמידה התמקד בהבדל בין מחמאה לבין ביקוש אמיתי: האם האדם רק אומר שזה מעניין, או שכבר יש כאב, התנהגות עבר, חלופה קיימת או נכונות לשלם/לשנות הרגל."
    learned:
      - "מחמאה היא לא החלטת מוצר. התנהגות היא אות חזק יותר מדעה נחמדה."
      - "כלי טוב לעסק קטן צריך לעזור לזהות דחיפות, לא רק לארגן רעיונות."
    built:
      - "טיוטת צ׳ק־ליסט פרטי לגילוי בעיה לפני ואחרי שיחת לקוח."
    next: "להפוך את ההבחנה לדוגמה ציבורית רק אם היא תעמוד בשער פרטיות ושימושיות."
    privacy: "ירוק"
    profiles: ["הרמי"]

